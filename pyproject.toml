[project]
name = "screenwriter"
version = "1.0.1"
description = "A tunable writing app for screenplays, books, ideas and mind maps (Qt/PySide6)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "certifi>=2026.7.22",
    "dulwich>=1.2.15",
    "keyring>=25.7.0",
    "pycrdt>=0.14.6",
    "pyside6>=6.11.2",
    "python-docx>=1.2.0",
    "spylls>=0.1.7",
]

[dependency-groups]
build = [
    "pillow>=12.3.0",
    "pyinstaller>=6.22.3",
]
dev = [
    "pytest>=9.1.1",
]
site = [
    "markdown>=3.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
